---
- name: Install phpunit with composer.
  ansible.builtin.import_role:
    name: composer
  when: phpunit.install
  vars:
    composer:
      command: require
      args: phpunit/phpunit

- name: Generate phpunit.xml file from provided file.
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ deploy_path }}/phpunit.xml"
  with_first_found:
    - "{{ playbook_dir }}/files/phpunit.xml"
    - "{{ _ce_deploy_build_dir }}/phpunit.xml"
    - "{{ _ce_deploy_build_dir }}/phpunit.xml.dist"
    - "{{ _ce_deploy_build_dir }}/{{ webroot }}/phpunit.xml"
    - "{{ _ce_deploy_build_dir }}/{{ webroot }}/phpunit.xml.dist"
  failed_when: false # don't fail if we don't find a file

- name: Check if we have a config file.
  ansible.builtin.stat:
    path: "{{ deploy_path }}/phpunit.xml"
  register: _phpunit_config

- name: Attempt to find Drupal's default phpunit.xml.dist file if we didn't receive an alternative.
  ansible.builtin.copy:
    src: "{{ deploy_path }}/{{ webroot }}/core/phpunit.xml.dist" # Drupal's default location
    dest: "{{ deploy_path }}/phpunit.xml"
  when: not _phpunit_config.stat.exists
  failed_when: false

- name: Check the config file again before running the tests.
  ansible.builtin.stat:
    path: "{{ deploy_path }}/phpunit.xml"
  register: _phpunit_config
  when: not _phpunit_config.stat.exists

# Docs - https://docs.phpunit.de/ - chapter 3
- name: Execute phpunit tests if we have a config.
  ansible.builtin.command:
    cmd: "{{ phpunit.bin }} --configuration {{ deploy_path }}/phpunit.xml --group {{ phpunit.group }} {{ phpunit.target }}"
  when: _phpunit_config.stat.exists
