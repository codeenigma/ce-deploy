---
- name: Set console path.
  ansible.builtin.set_fact:
    symfony_console_bin: "{{ symfony_console_bin | default('env php ' + deploy_path + '/bin/console') }}"

- name: Setup Mautic cron tasks.
  cron:
    name: "{{ project_name }}_{{ build_type }}_{{ entry.job }}"
    minute: "{{ entry.minute }}"
    hour: "{{ entry.hour | default(omit) }}"
    job: "env php {{ symfony_console_bin }} {{ entry.job }}"
  with_items: "{{ cron_mautic.entries }}"
  loop_control:
    loop_var: entry
  when: deploy_operation == 'deploy'
