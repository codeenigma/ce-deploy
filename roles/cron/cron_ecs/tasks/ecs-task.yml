---
- name: Set task definition name.
  set_fact:
    task_definition_name: "{{ project_name }}_{{ site.folder | regex_replace('[^a-zA-Z0-9_-]', '_') }}_task_{{ entry.job | regex_replace(' ', '_') }}"

- name: Set containers definition for drupal cron tasks.
  set_fact:
    dynamic_task_containers:
      - name: "{{ container_name }}"
        image: "{{ cron_ecs.docker_registry_name }}/{{ container_name }}:{{ cron_ecs.container_tag | default('latest') }}"
        essential: true
        entrypoint: "{{ cron_ecs.drupal_cron_entrypoint }}"
        command: "{{ cron_ecs.drupal_cron_command }}"
        logConfiguration:
          logDriver: awslogs
          options:
            awslogs-group: "/ecs/{{ cron_ecs.aws_ecs.cluster_name }}"
            awslogs-region: "{{ cron_ecs.aws_ecs.region }}"
            awslogs-stream-prefix: "{{ project_name }}_{{ task_definition_name }}"

- name: Create task definition.
  community.aws.ecs_taskdefinition:
    region: "{{ cron_ecs.aws_ecs.region }}"
    profile: "{{ cron_ecs.aws_ecs.aws_profile }}"
    family: "{{ task_definition_name }}"
    execution_role_arn: "{{ cron_ecs.aws_ecs.task_execution_role_arn }}"
    task_role_arn: "{{ cron_ecs.aws_ecs.task_role_arn | default(omit) }}"
    containers: "{{ dynamic_task_containers }}"
    launch_type: "{{ cron_ecs.aws_ecs.launch_type }}"
    cpu: "{{ cron_ecs.aws_ecs.cpu | default(omit) }}"
    memory: "{{ cron_ecs.aws_ecs.memory | default(omit) }}"
    state: present
    network_mode: "{{ cron_ecs.aws_ecs.network_mode }}"
    volumes: "{{ cron_ecs.aws_ecs.volumes | default(omit) }}"
    force_create: "{{ cron_ecs.aws_ecs.task_definition_force_create }}"
  register: task_definition_result
  delegate_to: localhost

