- name: Create schedule.
  amazon.aws.cloudwatchevent_rule:
    name: "{{ task_definition_name }}_schedule"
    schedule_expression: "cron({{ entry.minute }} {{ entry.hour | default(omit) }} {{ entry.day | default(omit) }} {{ entry.month | default(omit) }} {{ entry.weekday | default(omit) }})"
    targets:
      - id: "{{ task_definition_name }}"
        arn: "{{ task_definition_result.task_definition.task_definition_arn }}"
        ecs_parameters:
          task_count: "{{ cron_ecs.aws_ecs.task_count }}"
          task_definition_arn: "{{ task_definition_result.task_definition.task_definition_arn }}"
  delegate_to: localhost
