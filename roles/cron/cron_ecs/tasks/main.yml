---
- name: Connect to ECR.
  ansible.builtin.include_tasks:
    file: ecr-access.yml
  when: deploy_operation == 'cleanup'

- name: Gather all network information for scheduled ECS tasks.
  ansible.builtin.include_tasks:
    file: networking.yml
  when: deploy_operation == 'cleanup'
  delegate_to: localhost

- name: Create and push containers for the scheduled ECS tasks.
  ansible.builtin.include_tasks:
    file: site.yml
  with_items: "{{ drupal.sites }}"
  loop_control:
    loop_var: site
  when: deploy_operation == 'cleanup'
