name: Run test with ce-dev

# Run this workflow every time a new commit pushed to your repository
on: pull_request

jobs:
  # Set the job key. The key is displayed as the job name
  # when a job name is not provided
  run-tests:
    # Name the Job
    name: Run Drupal 10 test build
    # Set the type of machine to run on
    runs-on: ubuntu-latest

    steps:
      # Checks out a copy of your repository on the ubuntu-latest machine
      - name: Checkout code
        uses: actions/checkout@v2

      # Installs the ce-dev stack
      - name: Install ce-dev
        run: |
          cd /tmp
          wget https://golang.org/dl/go1.16.3.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.16.3.linux-amd64.tar.gz
          export PATH=$PATH:/usr/local/go/bin
          git clone https://github.com/FiloSottile/mkcert && cd mkcert
          go build -ldflags "-X main.Version=$(git describe --tags)"
          sudo mv ./mkcert /usr/local/bin && cd ../
          sudo chmod +x /usr/local/bin/mkcert
          rm -Rf mkcert
          curl -sL https://raw.githubusercontent.com/codeenigma/ce-dev/2.x/install.sh | /bin/sh -s -- --platform linux

      # Uses the ce-dev stack to run a test Drupal deploy
      - name: Run a test ce-dev deploy with Drupal 10
        run: |
          ce-dev create -p test -t drupal10 -d ~/test
          cd ~/test
          ce-dev init
          ce-dev start
          docker exec -t ce_dev_controller "/usr/bin/git config --global pull.rebase false"
          ce-dev provision
          ce-dev deploy
          curl https://www.test.local
        shell: bash
