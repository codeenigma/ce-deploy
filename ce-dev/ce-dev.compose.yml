version: "3.7"
x-ce_dev:
  version: 1.x
  registry: localhost:5000
  project_name: deploy
  provision:
    - ce-dev/ansible/setup.yml
services:
  controller:
    image: codeenigma/ce-dev-1.x
    x-ce_dev: {}
    volumes:
      - ../:/home/ce-dev/ce-deploy
    platform: linux/amd64
    cgroup: host
  web:
    image: codeenigma/ce-dev-1.x
    x-ce_dev:
      host_aliases:
        - deploy-web.local
    expose:
      - 80
      - 443
    volumes:
      - ../ce-dev/build/:/home/ce-dev/deploy/live.local:delegated
    platform: linux/amd64
    cgroup: host
  db:
    image: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ce-dev
    platform: linux/amd64
    cgroup: host
